name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts dashboard

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

      - name: Train on synthetic fallback (smoke test)
        run: python scripts/train.py

      - name: Calibrate on synthetic fallback (smoke test)
        run: python scripts/calibrate.py

      - name: Benchmark on synthetic fallback (smoke test)
        run: python scripts/bench.py --n-single 200

      # The HTTP load-test harness against a real uvicorn server, short: it has
      # to start the shipped config, measure server and machine CPU, record the
      # commit and the OpenMP team, and see no failed requests.
      - name: Load-test harness on synthetic fallback (smoke test)
        run: |
          pip install -r requirements-loadtest.txt
          python scripts/loadtest.py --levels 1,4 --warmup 0.5 --duration 2 --payloads 200 --out /tmp/loadtest_smoke.json
          python scripts/loadtest.py --check /tmp/loadtest_smoke.json
          python -c "import json; d = json.load(open('/tmp/loadtest_smoke.json')); assert d['summary']['total_errors'] == 0; assert d['server']['openmp_probe']['hgb_predict_openmp_threads'] == 1, d['server']"

      - name: Bootstrap CIs on synthetic fallback (smoke test)
        run: python scripts/bootstrap.py

      - name: Business-outcome table on synthetic fallback (smoke test)
        run: python scripts/business_case.py

  # MLflow + Evidently on the REAL ULB data from a clean checkout. The dataset is
  # public (TensorFlow's hosted copy, no login), cached between runs, and checked
  # against the sha256 of the file every committed ULB number was measured on.
  mlops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned environment + MLflow + Evidently
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mlops.txt
      - name: Cache the ULB dataset
        uses: actions/cache@v4
        with:
          path: data/creditcard.csv
          key: ulb-creditcard-76274b69
      - name: Fetch and verify ULB (284,807 rows, 492 fraud)
        run: |
          [ -f data/creditcard.csv ] || curl -sSfL -o data/creditcard.csv https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv
          echo "76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89  data/creditcard.csv" | sha256sum -c -
      - name: Train on ULB (logs a run to the local MLflow store)
        run: python scripts/train.py
      - name: Evidently drift + performance report over the two time windows
        run: python scripts/evidently_report.py
      - name: Committed ULB metrics and drift summary regenerate exactly
        run: git diff --exit-code artifacts/metrics_ulb_creditcard.json artifacts/evidently_summary_ulb_creditcard.json
      - name: Upload the tracking store and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-store-and-evidently-report
          path: |
            mlflow.db
            reports/evidently_ulb_creditcard.html
          retention-days: 30

  # Provenance of the live demo's rows. No model file is committed, so the
  # per-transaction export is only as good as a retrain: fetch the same
  # sha256-checked ULB file as the mlops job, retrain exactly as train.py does,
  # rebuild the export, and require artifacts/demo_scores_ulb_creditcard.json
  # back byte for byte (scripts/demo_data.py --verify).
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache the ULB dataset
        uses: actions/cache@v4
        with:
          path: data/creditcard.csv
          key: ulb-creditcard-76274b69
      - name: Fetch and verify ULB (284,807 rows, 492 fraud)
        run: |
          [ -f data/creditcard.csv ] || curl -sSfL -o data/creditcard.csv https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv
          echo "76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89  data/creditcard.csv" | sha256sum -c -
      - name: Retrain and regenerate the demo export byte for byte
        run: python scripts/demo_data.py --verify

  # The live demo page's own JavaScript, run for real: serve the site as
  # pages.yml assembles it, drive it in headless Chromium, and compare what it
  # displays with the committed artifacts (scripts/check_site.py).
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.60.0"
          python -m playwright install --with-deps chromium
      - name: Check what the demo page displays
        run: python scripts/check_site.py --screenshots screenshots
      - name: Upload the phone and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-page-screenshots
          path: screenshots
          retention-days: 30
