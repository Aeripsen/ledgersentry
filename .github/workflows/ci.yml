name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts dashboard

      - name: Type-check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

      - name: Train on synthetic fallback (smoke test)
        run: python scripts/train.py

      - name: Calibrate on synthetic fallback (smoke test)
        run: python scripts/calibrate.py

      - name: Benchmark on synthetic fallback (smoke test)
        run: python scripts/bench.py --n-single 200
