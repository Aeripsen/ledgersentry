name: pages

# Publishes the static demo in site/ to https://aeripsen.github.io/ledgersentry/.
#
# It runs only after the whole `ci` workflow has succeeded for a push to
# master, and it deploys exactly the commit that ci tested. That run has
# already checked CONSISTENCY: tests/test_demo_data.py rebuilds the committed
# knob table, PR-AUC and the business case's policies, sweep and bootstrap
# blocks from the committed per-transaction export, and the `site` job loads
# the assembled page in headless Chromium and checks what it displays.
#
# It does not check PROVENANCE. The ULB data file is not in the repo or in CI,
# so nothing here can regenerate the scores; `make reproduce` does that locally
# (scripts/verify_repro.py step 3 requires a fresh export byte for byte).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble the site from the committed artifacts (same code the site job checked)
        run: python scripts/check_site.py --build _site
      # the committed Evidently drift + performance report, served beside the demo
      - name: Add the Evidently report
        run: mkdir -p _site/reports && cp reports/*.html _site/reports/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
