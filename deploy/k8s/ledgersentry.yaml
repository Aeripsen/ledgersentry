# LedgerSentry on Kubernetes: a Deployment that runs the FastAPI serving image
# with liveness + readiness health checks, and a Service that fronts it.
#
# Liveness  -> GET /health : always 200 while the process is up, so the kubelet
#              never restarts a pod that is merely still loading its model.
# Readiness -> GET /ready  : 200 only once the compiled scorer is built, so the
#              Service sends traffic to a pod only when it can actually score.
# This split is the whole reason the service exposes both endpoints
# (src/ledgersentry/service.py).
#
# Apply:    kubectl apply -f deploy/k8s/ledgersentry.yaml
# Validate: kubectl apply --dry-run=client -f deploy/k8s/ledgersentry.yaml
# Full steps and how to build/push the image: DEPLOY.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgersentry
  labels:
    app: ledgersentry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledgersentry
  template:
    metadata:
      labels:
        app: ledgersentry
    spec:
      securityContext:
        runAsNonRoot: true          # enforced by the image's uid-10001 user
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Build + push this first (DEPLOY.md); swap in your registry path.
          image: ghcr.io/aeripsen/ledgersentry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ledgersentry
  labels:
    app: ledgersentry
spec:
  type: ClusterIP
  selector:
    app: ledgersentry           # must match the Deployment's pod labels above
  ports:
    - name: http
      port: 80
      targetPort: http          # -> the container's named 8000 port
