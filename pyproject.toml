[project]
name = "ledgersentry"
version = "0.1.0"
description = "Real-time financial-transaction fraud detection with a tunable reject-to-review option."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Strict where it pays: our own defs must be typed and internally consistent.
# The numeric stack (sklearn/pandas/joblib) is largely untyped upstream, so
# values crossing that boundary arrive as Any - full strict mode would mostly
# generate ceremony around library calls, not catch bugs.
python_version = "3.12"  # numpy's stubs use `type` statements (3.12+); code runs on 3.11
files = ["src/ledgersentry"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false  # returns crossing the sklearn/pandas boundary are Any
show_error_codes = true

[[tool.mypy.overrides]]
# shap/lightgbm/matplotlib are the optional analysis stack (requirements-
# analysis.txt) and ship no stubs; numba is deliberately absent in this
# environment (shap_report.py stubs it, the why is documented there), so mypy
# must not require it to exist.
module = [
    "sklearn.*", "joblib.*", "pandas.*", "shap.*", "lightgbm.*", "matplotlib.*", "numba.*",
    "mlflow.*",
]
ignore_missing_imports = true
