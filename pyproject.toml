[project]
name = "ledgersentry"
version = "0.1.0"
description = "Real-time financial-transaction fraud detection with a tunable reject-to-review option."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
